[package]
name = "a-z"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "a-z"
path = "src/main.rs"

[lib]
name = "a_z"
path = "src/lib.rs"

[features]
# Enable raw packet capture (requires Npcap SDK on Windows).
# Build with: cargo build --features sniffer
sniffer = ["pcap"]

[dependencies]
# HTTP + networking
reqwest = { version = "0.12", features = ["json", "native-tls", "http2", "gzip", "brotli", "deflate", "cookies", "blocking", "socks"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
arti-client = { version = "0.26", features = ["tokio", "static"] }
tor-rtcompat = { version = "0.26", features = ["tokio"] }
pcap = { version = "2.0", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling + logging
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"

# Utilities
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
http = "1"
async-trait = "0.1"
dashmap = "6"
mimalloc = { version = "0.1", default-features = false }
ron = "0.8"

# HTML parsing
html5ever = "0.26"
markup5ever_rcdom = "0.2"

# JavaScript engine
rquickjs = { version = "0.6", features = ["classes", "properties", "futures"] }

# Terminal UI (--tui mode)
ratatui   = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Vulturine software renderer
tiny-skia = "0.11"
fontdue  = "0.9"
taffy = "0.5"
